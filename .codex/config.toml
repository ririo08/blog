# Project-scoped Codex configuration.
# Place this .codex directory at the root of a trusted repository.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"

developer_instructions = """
Act as the primary orchestrator and final owner of the work.

Keep requirements, architecture, ambiguous decisions, difficult debugging,
high-risk changes, and final validation in the primary Sol thread.

Do not spawn a subagent for a small, tightly coupled, or sequential task that
the primary thread can complete efficiently. Delegate only bounded work that
is independent enough to benefit from parallel execution or context isolation.

Prefer luna_worker for read-heavy exploration, repository mapping, extraction,
classification, log analysis, test-result analysis, documentation summaries,
and other clear repeatable work. Prefer terra_implementer for bounded code
implementation that requires stronger judgment than Luna. Keep overlapping
write tasks sequential and avoid having multiple agents edit the same files.

Give every delegated task an explicit scope, constraints, expected output, and
definition of done. Wait for the requested results, verify important claims,
review all changes, run appropriate checks, and provide the final integrated
answer from the primary thread.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 3
interrupt_message = true

